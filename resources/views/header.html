<!-- ══════════════════════════════════════════════
     HEADER / TOPBAR COMPONENT
     Reusable header with notifications
═════════════════════════════════════════════════ -->

<div class="topbar">
  <div class="topbar-title" id="topbar-title">Dashboard</div>
  <div id="topbar-notif-bell" style="position: relative">
    <button
      onclick="toggleNotifDropdown()"
      style="
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--grey2);
        border: none;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      "
    >
      Notifications
      <span
        id="notif-count"
        style="
          background: var(--red);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
          padding: 2px 7px;
          border-radius: 20px;
        "
        >3</span
      >
    </button>
    <div
      id="notif-dropdown"
      style="
        display: none;
        position: absolute;
        top: 44px;
        right: 0;
        width: 340px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        z-index: 100;
        overflow: hidden;
      "
    >
      <div
        style="
          padding: 14px 16px;
          border-bottom: 1px solid var(--border);
          font-size: 14px;
          font-weight: 700;
          color: var(--text);
        "
      >
        Notifications
      </div>
      <div id="notif-list" style="max-height: 320px; overflow-y: auto"></div>
      <div
        style="
          padding: 10px 16px;
          border-top: 1px solid var(--border);
          text-align: center;
        "
      >
        <button
          onclick="markAllRead()"
          style="
            font-size: 12px;
            color: var(--blue);
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
          "
        >
          Mark all as read
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .topbar {
    height: 60px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 16px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-btn {
    padding: 8px 16px;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }

  .btn-primary {
    background: var(--blue);
    color: #fff;
  }

  .btn-primary:hover {
    background: #1d4ed8;
  }

  .btn-secondary {
    background: var(--grey2);
    color: var(--text2);
  }

  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-outline {
    background: transparent;
    color: var(--blue);
    border: 1px solid var(--blue) !important;
  }

  .btn-outline:hover {
    background: var(--blue-pale);
  }

  .notif-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--grey2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    font-size: 16px;
    transition: background 0.2s;
  }

  .notif-btn:hover {
    background: var(--border);
  }

  .notif-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    background: var(--red);
    border-radius: 50%;
    border: 2px solid white;
  }

  .notif-drop-item {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    align-items: flex-start;
  }

  .notif-drop-item:last-child {
    border-bottom: none;
  }

  .notif-drop-item:hover {
    background: var(--grey);
  }

  .notif-drop-item.unread {
    background: var(--blue-pale);
  }

  .notif-drop-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .notif-drop-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.4;
  }

  .notif-drop-time {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
  }
</style>
